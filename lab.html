            a: 1, b: -1, c: 3,
            coverX: 'Cover x=0 → −y = 3 → (0, −3)',
            coverY: 'Cover y=0 → x = 3 → (3, 0)',
            chips: ['Watch the minus: −y = 3!', 'Cover y=0 → x = 3'],
            onLine: (x, y) => x - y === 3,
          },
          sol: { x: 3, y: 0 },
          verifyText: 'Check (3, 0): 2(3) + 3(0) = 6 ✓ and 3 − 0 = 3 ✓',
        },
        {
          id: 'ineq',
          methodTag: 'System of Inequalities (Slope-Int + Standard)',
          title: 'Mission 4: Boundary, Shade & Safe Zone',
          kind: 'system_ineq',
          l1: {
            eq: 'y > x − 1',
            color: '#3b82f6',
            a: -1, b: 1, c: -1, // -x + y > -1
            wantDashed: true,
            wantOp: '>',
            testMsg: 'Test (0, 0): 0 > 0 − 1 → 0 > −1 is TRUE! Shade the side WITH (0, 0).',
            chips: ['Boundary: y = x − 1', 'Strict > → Dashed!'],
            onLine: (x, y) => y === x - 1,
          },
          l2: {
            eq: 'x + y ≤ 3',
            color: '#f97316',
            a: 1, b: 1, c: 3,
            wantDashed: false,
            wantOp: '<=',
            testMsg: 'Test (0, 0): 0 + 0 ≤ 3 is TRUE! Shade the side WITH (0, 0).',
            chips: ['Intercepts: (0, 3) & (3, 0)', '≤ includes boundary → Solid!'],
            onLine: (x, y) => x + y === 3,
          },
          checkPoint: (x, y) => ({
            ok: y > x - 1 && x + y <= 3,
            onDashed: y === x - 1,
          }),
        },
      ];

      let ch2Act1 = null;
      function initCh2Act1(idx) {
        const p = ch2Act1Puzzles[idx];
        ch2Act1 = {
          idx,
          step: 'l1_pts', // l1_pts -> (l1_style -> l1_shade) -> l2_pts -> (l2_style -> l2_shade) -> pick_sol -> done
          l1Pts: [],
          l2Pts: [],
          l1Dashed: null,
          l1Shade: null,
          l2Dashed: null,
          l2Shade: null,
          pickedSol: null,
          coverMode: null,
          msg: null,
          warn: false,
          solved: false,
        };
      }

      function renderCh2Act1() {
        const idx = state.idx2[1];
        if (!ch2Act1 || ch2Act1.idx !== idx) initCh2Act1(idx);
        const p = ch2Act1Puzzles[idx];
        const s = ch2Act1;

        const lines = [];
        const shades = [];
        const dots = [];
        let overlapPoly = null;

        if (s.l1Pts.length === 2) {
          lines.push({ a: p.l1.a, b: p.l1.b, c: p.l1.c, color: p.l1.color, dashed: s.l1Dashed === true });
        }
        if (s.l2Pts.length === 2) {
          lines.push({ a: p.l2.a, b: p.l2.b, c: p.l2.c, color: p.l2.color, dashed: s.l2Dashed === true });
        }
        if (p.kind === 'system_ineq') {
          if (s.l1Shade) shades.push({ a: p.l1.a, b: p.l1.b, c: p.l1.c, op: s.l1Shade, color: p.l1.color });
          if (s.l2Shade) shades.push({ a: p.l2.a, b: p.l2.b, c: p.l2.c, op: s.l2Shade, color: p.l2.color });
          if (s.l1Shade && s.l2Shade) {
            overlapPoly = clipHalfPlane(
              clipHalfPlane(FULL_BOX, p.l1.a, p.l1.b, s.l1Shade, p.l1.c),
              p.l2.a, p.l2.b, s.l2Shade, p.l2.c
            );
          }
        }
        s.l1Pts.forEach((pt) => dots.push({ x: pt.x, y: pt.y, color: p.l1.color, label: `(${pt.x},${pt.y})` }));
        s.l2Pts.forEach((pt) => dots.push({ x: pt.x, y: pt.y, color: p.l2.color, label: `(${pt.x},${pt.y})` }));
        if (s.pickedSol) {
          dots.push({ x: s.pickedSol.x, y: s.pickedSol.y, color: '#22c55e', pulse: true, label: `(${s.pickedSol.x},${s.pickedSol.y})` });
        }

        const isInteractiveGrid = s.step === 'l1_pts' || s.step === 'l2_pts' || s.step === 'pick_sol';

        let promptBanner = '';
        if (s.step === 'l1_pts') {
          promptBanner = `Step 1: Click <b>2 grid points</b> on <span class="font-mono text-blue-400">${p.l1.eq}</span> (${s.l1Pts.length}/2 placed)`;
        } else if (s.step === 'l1_style') {
          promptBanner = `Line 1 Boundary: Should <span class="font-mono text-blue-400">${p.l1.eq}</span> be <b>Solid</b> or <b>Dashed</b>?`;
        } else if (s.step === 'l1_shade') {
          promptBanner = `Line 1 Shading: ${p.l1.testMsg}`;
        } else if (s.step === 'l2_pts') {
          promptBanner = `Next: Click <b>2 grid points</b> on <span class="font-mono text-orange-400">${p.l2.eq}</span> (${s.l2Pts.length}/2 placed)`;
        } else if (s.step === 'l2_style') {
          promptBanner = `Line 2 Boundary: Should <span class="font-mono text-orange-400">${p.l2.eq}</span> be <b>Solid</b> or <b>Dashed</b>?`;
        } else if (s.step === 'l2_shade') {
          promptBanner = `Line 2 Shading: ${p.l2.testMsg}`;
        } else if (s.step === 'pick_sol') {
          promptBanner = p.kind === 'system_eq'
            ? `🎯 Final Tap: Click the <b>intersection point</b> where Blue and Orange cross!`
            : `🎯 Final Tap: Click <b>ANY grid point inside the Green Safe Zone</b> (remember dashed vs solid)!`;
        } else {
          promptBanner = `✅ Mission Complete!`;
        }

        const activeLine = s.step.startsWith('l1') ? p.l1 : p.l2;

        stage.innerHTML = `
          <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-[var(--border)]">
            <div class="flex items-center gap-1.5">
              ${ch2Act1Puzzles.map((_, i) => `
                <button data-c2p1="${i}" class="px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer border ${i === idx ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)]' : state.cleared2[1][i] ? 'bg-emerald-500/15 text-emerald-500 border-emerald-500/40' : 'bg-[var(--background)] border-[var(--border)] text-[var(--muted-foreground)]'}">
                  ${state.cleared2[1][i] ? '✓ ' : ''}M${i + 1}
                </button>
              `).join('')}
            </div>
            <span class="text-xs font-semibold text-[var(--primary)]">${p.methodTag}</span>
          </div>

          <div class="flex flex-wrap items-center justify-between gap-2">
            <h2 class="text-base font-bold m-0">${p.title}</h2>
            <button id="c2a1-reset" class="px-3 py-1 rounded-lg text-xs font-semibold border border-[var(--border)] bg-[var(--background)] cursor-pointer">↺ Reset Grid</button>
          </div>

          <!-- Split Layout: Left Equations + Visual Hints, Right Live Coordinate Grid -->
          <div class="grid md:grid-cols-12 gap-4 items-start">
            <div class="md:col-span-5 space-y-3">
              <!-- Equation Cards -->
              <div class="rounded-xl p-3 border-2 transition ${s.step.startsWith('l1') ? 'border-blue-500 bg-blue-500/10' : 'border-[var(--border)] bg-[var(--background)]'}">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-bold uppercase text-blue-400">Equation 1 (Blue)</span>
                  <span class="text-xs font-mono">${s.l1Pts.length === 2 ? '✓ Graphed' : `${s.l1Pts.length}/2 pts`}</span>
                </div>
                <div class="text-xl font-extrabold font-mono mt-1">${p.l1.eq}</div>
                <div class="flex flex-wrap gap-1.5 mt-2">
                  ${p.l1.chips.map((c) => `<span class="text-xs px-2 py-0.5 rounded-md bg-[var(--card)] border border-[var(--border)]">${c}</span>`).join('')}
                </div>
              </div>

              <div class="rounded-xl p-3 border-2 transition ${s.step.startsWith('l2') ? 'border-orange-500 bg-orange-500/10' : 'border-[var(--border)] bg-[var(--background)]'}">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-bold uppercase text-orange-400">Equation 2 (Orange)</span>
                  <span class="text-xs font-mono">${s.l2Pts.length === 2 ? '✓ Graphed' : `${s.l2Pts.length}/2 pts`}</span>
                </div>
                <div class="text-xl font-extrabold font-mono mt-1">${p.l2.eq}</div>
                <div class="flex flex-wrap gap-1.5 mt-2">
                  ${p.l2.chips.map((c) => `<span class="text-xs px-2 py-0.5 rounded-md bg-[var(--card)] border border-[var(--border)]">${c}</span>`).join('')}
                </div>
              </div>

              ${p.hasCoverUp && (s.step === 'l1_pts' || s.step === 'l2_pts') ? `
                <div class="rounded-xl p-3 border border-[var(--border)] bg-[var(--background)] space-y-2">
                  <div class="text-xs font-bold text-[var(--muted-foreground)]">🙈 Cover-Up Finger Tool:</div>
                  <div class="flex gap-2">
                    <button id="cov-x" class="flex-1 px-2.5 py-1.5 rounded-lg text-xs font-bold border border-[var(--border)] cursor-pointer ${s.coverMode === 'x' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'bg-[var(--card)]'}">Cover x = 0</button>
                    <button id="cov-y" class="flex-1 px-2.5 py-1.5 rounded-lg text-xs font-bold border border-[var(--border)] cursor-pointer ${s.coverMode === 'y' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'bg-[var(--card)]'}">Cover y = 0</button>
                  </div>
                  ${s.coverMode ? `<div class="text-xs font-mono font-bold text-emerald-400">${s.coverMode === 'x' ? activeLine.coverX : activeLine.coverY}</div>` : ''}
                </div>
              ` : ''}

              <!-- Active Instruction Box -->
              <div class="rounded-xl p-3 border border-[var(--primary)]/40 bg-[var(--primary)]/10 text-xs leading-relaxed">
                ${promptBanner}
              </div>

              <!-- Inequality Style / Shade Buttons -->
              ${s.step === 'l1_style' || s.step === 'l2_style' ? `
                <div class="grid grid-cols-2 gap-2 anim-in">
                  <button data-style="solid" class="px-3 py-2.5 rounded-xl text-xs font-bold border-2 border-[var(--border)] bg-[var(--background)] hover:border-[var(--primary)] cursor-pointer">
                    ━━ Solid (≤ or ≥)
                  </button>
                  <button data-style="dashed" class="px-3 py-2.5 rounded-xl text-xs font-bold border-2 border-[var(--border)] bg-[var(--background)] hover:border-[var(--primary)] cursor-pointer">
                    ╌╌ Dashed (&lt; or &gt;)
                  </button>
                </div>
              ` : ''}

              ${s.step === 'l1_shade' || s.step === 'l2_shade' ? `
                <div class="grid grid-cols-2 gap-2 anim-in">
                  <button data-shade=">" class="px-3 py-2.5 rounded-xl text-xs font-bold border-2 border-[var(--border)] bg-[var(--background)] hover:border-[var(--primary)] cursor-pointer">
                    ⬆️ Shade ABOVE
                  </button>
                  <button data-shade="<" class="px-3 py-2.5 rounded-xl text-xs font-bold border-2 border-[var(--border)] bg-[var(--background)] hover:border-[var(--primary)] cursor-pointer">
                    ⬇️ Shade BELOW
                  </button>
                </div>
              ` : ''}

              ${s.msg ? `
                <div class="anim-in rounded-xl p-3 border text-xs font-semibold space-y-2 ${s.solved ? 'bg-emerald-500/15 border-emerald-500/50 text-emerald-400' : s.warn ? 'bg-rose-500/15 border-rose-500/50 text-rose-400' : 'bg-blue-500/15 border-blue-500/50 text-blue-400'}">
                  <div>${s.msg}</div>
                  ${s.solved && idx < ch2Act1Puzzles.length - 1 ? `<button id="c2a1-next" class="px-3 py-1.5 rounded-lg bg-emerald-500 text-white font-bold text-xs cursor-pointer">Next Mission →</button>` : ''}
                </div>
              ` : ''}
            </div>

            <div class="md:col-span-7">
              ${buildCoordSvg({
                lines,
                shades,
                overlapPoly,
                dots,
                interactive: isInteractiveGrid,
                testDot: p.kind === 'system_ineq' ? { x: 0, y: 0 } : null,
              })}
              <div class="text-center text-xs text-[var(--muted-foreground)] mt-1.5">
                ${isInteractiveGrid ? 'Tap integer intersections on the grid (−6 to +6)' : 'Use the buttons on the left to set boundary & shading'}
              </div>
            </div>
          </div>
        `;

        stage.querySelectorAll('[data-c2p1]').forEach((b) => {
          b.addEventListener('click', () => {
            state.idx2[1] = Number(b.dataset.c2p1);
            initCh2Act1(state.idx2[1]);
            renderCh2Act1();
          });
        });
        document.getElementById('c2a1-reset').addEventListener('click', () => {
          initCh2Act1(idx);
          beep(300, 0.05);
          renderCh2Act1();
        });
        const covX = document.getElementById('cov-x');
        const covY = document.getElementById('cov-y');
        if (covX) covX.addEventListener('click', () => { s.coverMode = 'x'; beep(440, 0.05); renderCh2Act1(); });
        if (covY) covY.addEventListener('click', () => { s.coverMode = 'y'; beep(440, 0.05); renderCh2Act1(); });

        stage.querySelectorAll('.grid-hit').forEach((circle) => {
          circle.addEventListener('click', () => {
            const gx = Number(circle.dataset.gx);
            const gy = Number(circle.dataset.gy);
            if (s.step === 'l1_pts') {
              if (s.l1Pts.some((pt) => pt.x === gx && pt.y === gy)) return;
              if (p.l1.onLine(gx, gy)) {
                s.l1Pts.push({ x: gx, y: gy });
                s.warn = false;
                sfxGood();
                if (s.l1Pts.length === 2) {
                  s.msg = `Blue line slung!`;
                  s.coverMode = null;
                  s.step = p.kind === 'system_ineq' ? 'l1_style' : 'l2_pts';
                } else {
                  s.msg = `Nice! (${gx}, ${gy}) is on Line 1. Tap 1 more point.`;
                }
              } else {
                sfxWarn();
                breakStreak();
                s.warn = true;
                s.msg = `(${gx}, ${gy}) is NOT on ${p.l1.eq}. Check the chips on the left!`;
              }
              renderCh2Act1();
            } else if (s.step === 'l2_pts') {
              if (s.l2Pts.some((pt) => pt.x === gx && pt.y === gy)) return;
              if (p.l2.onLine(gx, gy)) {
                s.l2Pts.push({ x: gx, y: gy });
                s.warn = false;
                sfxGood();
                if (s.l2Pts.length === 2) {
                  s.msg = `Orange line slung!`;
                  s.coverMode = null;
                  s.step = p.kind === 'system_ineq' ? 'l2_style' : 'pick_sol';
                } else {
                  s.msg = `Great! (${gx}, ${gy}) is on Line 2. Tap 1 more point.`;
                }
              } else {
                sfxWarn();
                breakStreak();
                s.warn = true;
                s.msg = `(${gx}, ${gy}) is NOT on ${p.l2.eq}. Check the chips on the left!`;
              }
              renderCh2Act1();
            } else if (s.step === 'pick_sol') {
              if (p.kind === 'system_eq') {
                if (gx === p.sol.x && gy === p.sol.y) {
                  s.pickedSol = { x: gx, y: gy };
                  s.solved = true;
                  s.step = 'done';
                  s.warn = false;
                  s.msg = `🎯 BULLSEYE! (${gx}, ${gy}) solves BOTH equations! ${p.verifyText} (+30 XP)`;
                  sfxWin();
                  addXP(30);
                  markCleared2(1, idx);
                } else {
                  sfxWarn();
                  breakStreak();
                  s.warn = true;
                  s.msg = `(${gx}, ${gy}) isn't where the Blue and Orange lines cross!`;
                }
              } else {
                const res = p.checkPoint(gx, gy);
                if (res.ok) {
                  s.pickedSol = { x: gx, y: gy };
                  s.solved = true;
                  s.step = 'done';
                  s.warn = false;
                  s.msg = `🛡️ SAFE ZONE! (${gx}, ${gy}) satisfies BOTH ${p.l1.eq} and ${p.l2.eq}! (+35 XP)`;
                  sfxWin();
                  addXP(35);
                  markCleared2(1, idx);
                } else if (res.onDashed) {
                  sfxWarn();
                  breakStreak();
                  s.warn = true;
                  s.msg = `⚠️ Trap! (${gx}, ${gy}) is right on the DASHED blue line — strict > excludes the boundary!`;
                } else {
                  sfxWarn();
                  breakStreak();
                  s.warn = true;
                  s.msg = `(${gx}, ${gy}) is outside the Green double-shaded zone. Test it in both inequalities!`;
                }
              }
              renderCh2Act1();
            }
          });
        });

        stage.querySelectorAll('[data-style]').forEach((b) => {
          b.addEventListener('click', () => {
            const isDashed = b.dataset.style === 'dashed';
            const line = s.step === 'l1_style' ? p.l1 : p.l2;
            if (isDashed === line.wantDashed) {
              if (s.step === 'l1_style') { s.l1Dashed = isDashed; s.step = 'l1_shade'; }
              else { s.l2Dashed = isDashed; s.step = 'l2_shade'; }
              s.warn = false;
              s.msg = `Correct! ${isDashed ? 'Strict < or > uses a DASHED line.' : '≤ or ≥ includes the line, so SOLID.'}`;
              sfxGood();
            } else {
              sfxWarn();
              breakStreak();
              s.warn = true;
              s.msg = `Check the symbol in ${line.eq}: ${line.wantDashed ? 'strict > / < means DASHED (points on line don’t count).' : '≤ / ≥ has the equals bar, so SOLID!'}`;
            }
            renderCh2Act1();
          });
        });

        stage.querySelectorAll('[data-shade]').forEach((b) => {
          b.addEventListener('click', () => {
            const dir = b.dataset.shade; // '>' = above (y bigger), '<' = below (y smaller)
            const isL1 = s.step === 'l1_shade';
            const line = isL1 ? p.l1 : p.l2;
            // For l1 (y > x - 1 -> -x + y > -1): above means '>'
            // For l2 (x + y <= 3 -> x + y <= 3): below means '<='
            const wantDir = line.wantOp === '>' || line.wantOp === '>=' ? '>' : '<';
            if (dir === wantDir) {
              if (isL1) { s.l1Shade = line.wantOp; s.step = 'l2_pts'; }
              else { s.l2Shade = line.wantOp; s.step = 'pick_sol'; }
              s.warn = false;
              s.msg = `Shaded! ${isL1 ? 'Now graph the Orange inequality!' : 'Look at the Green overlap zone — click a solution point inside it!'}`;
              sfxGood();
            } else {
              sfxWarn();
              breakStreak();
              s.warn = true;
              s.msg = `Test (0, 0) in ${line.eq}: (0, 0) makes it TRUE, so shade the side containing (0, 0)!`;
            }
            renderCh2Act1();
          });
        });

        const nxt = document.getElementById('c2a1-next');
        if (nxt) nxt.addEventListener('click', () => {
          state.idx2[1] = idx + 1;
          initCh2Act1(state.idx2[1]);
          renderCh2Act1();
        });
      }

      // ---------- Chapter 2 Act 2: Graph Bug Hunter (Critical Thinking) ----------
      const ch2Act2Puzzles = [
        {
          title: 'Bug #1: Point-Slope Sign Flip',
          given: 'y + 2 = 3(x − 1)',
          claim: 'Villain plotted the anchor at (1, +2) and slope 3.',
          graph: {
            lines: [
              { a: 3, b: -1, c: 1, color: '#ef4444' }, // wrong line through (1, 2) slope 3 -> y-2=3(x-1) -> 3x-y=1
              { a: 3, b: -1, c: 5, color: '#22c55e', dashed: true }, // right line 3x-y=5
            ],
            dots: [
              { x: 1, y: 2, color: '#ef4444', label: 'Plotted (1,2)' },
              { x: 1, y: -2, color: '#22c55e', label: 'True (1,-2)' },
            ],
          },
          choices: [
            { text: 'y + 2 means y − (−2), so the anchor y-value is −2, giving (1, −2) not (1, +2)!', ok: true },
            { text: 'The slope should be −3 instead of +3.', ok: false },
            { text: 'Point-slope form always starts at the y-intercept (0, 2).', ok: false },
          ],
          fixText: 'Plug (1, 2) in to check: 2 + 2 = 4 ≠ 3(1 − 1) = 0! Plugging (1, −2) gives −2 + 2 = 0 ✓.',
        },
        {
          title: 'Bug #2: Cover-Up Minus Sign Drop',
          given: '2x − 3y = 6',
          claim: 'Villain covered 2x and got 3y = 6 → plotted y-intercept (0, +2).',
          graph: {
            lines: [
              { a: 2, b: 3, c: 6, color: '#ef4444' }, // wrong intercepts (3,0) and (0,2)
              { a: 2, b: -3, c: 6, color: '#22c55e', dashed: true },
            ],
            dots: [
              { x: 3, y: 0, color: '#3b82f6', label: '(3,0) OK' },
              { x: 0, y: 2, color: '#ef4444', label: 'Wrong (0,2)' },
              { x: 0, y: -2, color: '#22c55e', label: 'True (0,-2)' },
            ],
          },
          choices: [
            { text: 'Dropped the minus in front of 3y: covering 2x leaves −3y = 6, so y = −2 → (0, −2)!', ok: true },
            { text: 'Covering x = 0 should give 2y = 6, so y = 3.', ok: false },
            { text: 'Standard form cannot be graphed using intercepts.', ok: false },
          ],
          fixText: 'Always keep the sign attached to the term! Check (0, −2): 2(0) − 3(−2) = +6 ✓.',
        },
        {
          title: 'Bug #3: The Solid Boundary Trap',
          given: 'y < 2x + 1',
          claim: 'Villain drew a SOLID line and claimed (0, 1) is a solution.',
          graph: {
            lines: [{ a: 2, b: -1, c: -1, color: '#ef4444', dashed: false }],
            shades: [{ a: 2, b: -1, c: -1, op: '>=', color: '#ef4444' }], // 2x - y >= -1 -> y <= 2x + 1
            dots: [{ x: 0, y: 1, color: '#ef4444', pulse: true, label: 'Claimed (0,1)' }],
          },
          choices: [
            { text: 'Strict < needs a DASHED line! At (0, 1), 1 < 1 is FALSE, so boundary points are NOT solutions.', ok: true },
            { text: 'y < 2x + 1 should be shaded ABOVE the line instead of below.', ok: false },
            { text: 'The y-intercept of y < 2x + 1 is (1, 0), not (0, 1).', ok: false },
          ],
          fixText: 'Remember: < or > = DASHED (hollow boundary). ≤ or ≥ = SOLID (included).',
        },
        {
          title: 'Bug #4: Forgot to Flip When Dividing by Negative',
          given: 'x − 2y ≤ 4',
          claim: 'Villain converted: −2y ≤ −x + 4 → y ≤ ½x − 2 and shaded BELOW (Red).',
          graph: {
            lines: [{ a: 1, b: -2, c: 4, color: '#f97316' }],
            shades: [
              { a: 1, b: -2, c: 4, op: '>=', color: '#ef4444' }, // y <= 0.5x - 2
              { a: 1, b: -2, c: 4, op: '<=', color: '#22c55e' }, // true: x - 2y <= 4 -> y >= 0.5x - 2
            ],
            dots: [{ x: 0, y: 0, color: '#22c55e', label: '(0,0) TRUE!' }],
          },
          choices: [
            { text: 'Dividing by −2 MUST flip ≤ to ≥! True region is y ≥ ½x − 2 (ABOVE, containing (0, 0)).', ok: true },
            { text: 'Dividing by −2 turns ½x into −½x only.', ok: false },
            { text: '(0, 0) fails x − 2y ≤ 4 because 0 ≤ 4 is false.', ok: false },
          ],
          fixText: 'Quick safety check: test (0, 0) in original x − 2y ≤ 4 → 0 ≤ 4 (TRUE!), so (0, 0) MUST be shaded!',
        },
      ];

      let ch2Act2 = null;
      function initCh2Act2(idx) {
        ch2Act2 = { idx, picked: null, solved: false, msg: null };
      }

      function renderCh2Act2() {
        const idx = state.idx2[2];
        if (!ch2Act2 || ch2Act2.idx !== idx) initCh2Act2(idx);
        const p = ch2Act2Puzzles[idx];
        const s = ch2Act2;

        stage.innerHTML = `
          <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-[var(--border)]">
            <div class="flex items-center gap-1.5">
              ${ch2Act2Puzzles.map((_, i) => `
                <button data-c2p2="${i}" class="px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer border ${i === idx ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)]' : state.cleared2[2][i] ? 'bg-emerald-500/15 text-emerald-500 border-emerald-500/40' : 'bg-[var(--background)] border-[var(--border)] text-[var(--muted-foreground)]'}">
                  ${state.cleared2[2][i] ? '✓ ' : ''}B${i + 1}
                </button>
              `).join('')}
            </div>
            <span class="text-xs font-semibold text-[var(--warning)]">Critical Thinking · Spot the Graph Bug</span>
          </div>

          <div class="grid md:grid-cols-12 gap-4 items-start">
            <div class="md:col-span-6 space-y-3">
              <div>
                <h2 class="text-base font-bold m-0">${p.title}</h2>
                <div class="mt-2 rounded-xl bg-[var(--background)] border border-[var(--border)] p-3">
                  <div class="text-xs text-[var(--muted-foreground)] uppercase font-bold">Target Problem</div>
                  <div class="text-xl font-extrabold font-mono mt-0.5">${p.given}</div>
                  <div class="text-xs text-rose-400 font-semibold mt-1">❌ ${p.claim}</div>
                </div>
              </div>

              <div class="space-y-2">
                <div class="text-xs font-bold text-[var(--muted-foreground)] uppercase">What went wrong on the graph?</div>
                ${p.choices.map((ch, ci) => {
                  const chosen = s.picked === ci;
                  const cls = s.solved && ch.ok
                    ? 'border-emerald-500 bg-emerald-500/15 text-emerald-400'
                    : chosen && !ch.ok
                    ? 'border-rose-500 bg-rose-500/15 text-rose-400'
                    : 'border-[var(--border)] bg-[var(--background)] hover:border-[var(--primary)]';
                  return `
                    <button data-c2c2="${ci}" ${s.solved ? 'disabled' : ''} class="w-full text-left px-3.5 py-2.5 rounded-xl border-2 text-xs font-semibold transition cursor-pointer ${cls}">
                      ${ch.text}
                    </button>
                  `;
                }).join('')}
              </div>

              ${s.msg ? `
                <div class="anim-in rounded-xl p-3 border text-xs font-semibold space-y-1.5 ${s.solved ? 'bg-emerald-500/15 border-emerald-500/50 text-emerald-400' : 'bg-amber-500/15 border-amber-500/50 text-amber-400'}">
                  <div>${s.msg}</div>
                  ${s.solved ? `<div class="text-[var(--foreground)] font-normal">${p.fixText}</div>` : ''}
                  ${s.solved && idx < ch2Act2Puzzles.length - 1 ? `<button id="c2a2-next" class="mt-1 px-3 py-1.5 rounded-lg bg-emerald-500 text-white font-bold text-xs cursor-pointer">Next Bug →</button>` : ''}
                </div>
              ` : ''}
            </div>

            <div class="md:col-span-6">
              ${buildCoordSvg(p.graph)}
              <div class="text-center text-xs text-[var(--muted-foreground)] mt-1.5">Red = villain’s buggy graph · Green dashed = true fix</div>
            </div>
          </div>
        `;

        stage.querySelectorAll('[data-c2p2]').forEach((b) => {
          b.addEventListener('click', () => {
            state.idx2[2] = Number(b.dataset.c2p2);
            initCh2Act2(state.idx2[2]);
            renderCh2Act2();
          });
        });

        stage.querySelectorAll('[data-c2c2]').forEach((b) => {
          b.addEventListener('click', () => {
            const ci = Number(b.dataset.c2c2);
            s.picked = ci;
            if (p.choices[ci].ok) {
              s.solved = true;
              s.msg = '🕷️ Bug Crushed! (+30 XP)';
              sfxWin();
              addXP(30);
              markCleared2(2, idx);
            } else {
              sfxWarn();
              breakStreak();
              s.msg = 'Look closely at the Red vs Green markers on the graph and re-check the signs!';
            }
            renderCh2Act2();
          });
        });

        const nxt = document.getElementById('c2a2-next');
        if (nxt) nxt.addEventListener('click', () => {
          state.idx2[2] = idx + 1;
          initCh2Act2(state.idx2[2]);
          renderCh2Act2();
        });
      }

      // ---------- Chapter 2 Act 3: Second-Order Graphing Lab ----------
      const ch2Act3Puzzles = [
        {
          title: 'Lab 1: When Does the Intersection Vanish?',
          prompt: 'Blue is y = 2x − 1. Orange is y = mx + 3. Slide m toward 2 — what happens to the green crossing point, and when does the system have NO SOLUTION?',
          slider: { label: 'Orange slope m', min: -1, max: 4, step: 0.5, init: 0.5, target: 2 },
          choices: [
            { text: 'At m = 2: slopes match (parallel) with different y-intercepts, so they NEVER cross (0 solutions).', ok: true },
            { text: 'At m = 0: a horizontal line never crosses a diagonal line.', ok: false },
            { text: 'At m = −1: opposite slopes always mean no solution.', ok: false },
          ],
          explain: 'Second-order insight: Same slope (m = 2) + different y-intercept (−1 ≠ 3) = parallel lines = 0 solutions. As m approaches 2, the crossing point shoots farther away!',
          renderViz: (m) => {
            const lines = [
              { a: 2, b: -1, c: 1, color: '#3b82f6' }, // y = 2x - 1
              { a: m, b: -1, c: -3, color: '#f97316' }, // y = mx + 3
            ];
            const dots = [];
            let status = '';
            if (Math.abs(m - 2) < 1e-6) {
              status = '🚫 PARALLEL! No intersection anywhere (0 solutions)';
            } else {
              const ix = 4 / (2 - m);
              const iy = 2 * ix - 1;
              status = `Crosses at (${ix.toFixed(1)}, ${iy.toFixed(1)})`;
              if (ix >= -6 && ix <= 6 && iy >= -6 && iy <= 6) {
                dots.push({ x: ix, y: iy, color: '#22c55e', pulse: true, label: `(${ix.toFixed(1)},${iy.toFixed(1)})` });
              } else {
                status += ' (shot off the grid!)';
              }
            }
            return {
              svg: buildCoordSvg({ lines, dots, sizeClass: 'w-full max-w-sm mx-auto block' }),
              readout: `<div class="font-mono text-sm font-bold">${status}</div><div class="text-xs text-[var(--muted-foreground)] mt-1">Blue: y = 2x − 1 · Orange: y = ${m}x + 3</div>`,
            };
          },
        },
        {
          title: 'Lab 2: Standard Form Coefficient Pivot',
          prompt: 'Orange is 2x + By = 12, paired with Blue y = 2. Slide B from 3 to 6 (doubling B). What stays LOCKED, and what happens to the intersection?',
          slider: { label: 'Coefficient B', min: 1, max: 6, step: 1, init: 3, target: 6 },
          choices: [
            { text: 'x-intercept (6, 0) stays PINNED; y-intercept cuts in half (0,4)→(0,2) and intersection moves left to (0, 2)!', ok: true },
            { text: 'Both intercepts cut in half, so the line shifts down evenly.', ok: false },
            { text: 'The y-intercept stays locked while the x-intercept doubles.', ok: false },
          ],
          explain: 'Second-order insight: When y = 0, By disappears completely! So 2x = 12 → (6, 0) is immune to B. Changing B only scales the y-intercept (12/B), pivoting the line around (6, 0)!',
          renderViz: (B) => {
            const yInt = 12 / B;
            const ix = (12 - 2 * B) / 2; // 2x + B(2) = 12 -> x = 6 - B
            const lines = [
              { a: 0, b: 1, c: 2, color: '#3b82f6' }, // y = 2
              { a: 2, b: B, c: 12, color: '#f97316' }, // 2x + By = 12
            ];
            const dots = [
              { x: 6, y: 0, color: '#f97316', label: '(6,0) PINNED' },
              { x: ix, y: 2, color: '#22c55e', pulse: true, label: `(${ix},2)` },
            ];
            if (yInt <= 6) dots.push({ x: 0, y: yInt, color: '#f97316', label: `(0,${Number.isInteger(yInt) ? yInt : yInt.toFixed(1)})` });
            return {
              svg: buildCoordSvg({ lines, dots, sizeClass: 'w-full max-w-sm mx-auto block' }),
              readout: `<div class="font-mono text-sm font-bold">2x + ${B}y = 12 ∩ y = 2 → (${ix}, 2)</div><div class="text-xs text-[var(--muted-foreground)] mt-1">x-int: (6, 0) · y-int: (0, ${Number.isInteger(yInt) ? yInt : yInt.toFixed(1)})</div>`,
            };
          },
        },
        {
          title: 'Lab 3: Vanishing Inequality Safe Zone',
          prompt: 'Blue is y ≥ x + 1 (solid). Orange is y < x + k (dashed). Slide k down — for which values of k does the Green overlap vanish completely (NO solution)?',
          slider: { label: 'Orange shift k', min: -2, max: 5, step: 1, init: 4, target: 1 },
          choices: [
            { text: 'k ≤ 1 (at k = 1, y ≥ x + 1 and y < x + 1 share ZERO points because < is strict!)', ok: true },
            { text: 'Only when k < 1 (at k = 1 they share the line y = x + 1).', ok: false },
            { text: 'Never — two inequalities always overlap somewhere.', ok: false },
          ],
          explain: 'Second-order edge case: A number cannot be BOTH ≥ x + 1 AND strictly < x + 1! So at k = 1 the solid and dashed lines sit on top of each other with ZERO shared points.',
          renderViz: (k) => {
            const lines = [
              { a: -1, b: 1, c: 1, color: '#3b82f6', dashed: false },
              { a: -1, b: 1, c: k, color: '#f97316', dashed: true },
            ];
            const shades = [
              { a: -1, b: 1, c: 1, op: '>=', color: '#3b82f6' },
              { a: -1, b: 1, c: k, op: '<', color: '#f97316' },
            ];
            let overlapPoly = null;
            if (k > 1) {
              overlapPoly = clipHalfPlane(clipHalfPlane(FULL_BOX, -1, 1, '>=', 1), -1, 1, '<', k);
            }
            return {
              svg: buildCoordSvg({ lines, shades, overlapPoly, sizeClass: 'w-full max-w-sm mx-auto block' }),
              readout: `<div class="font-mono text-sm font-bold ${k <= 1 ? 'text-rose-400' : 'text-emerald-400'}">${k <= 1 ? '🚫 EMPTY! 0 Solutions' : `✅ Green Strip Width = ${k - 1}`}</div><div class="text-xs text-[var(--muted-foreground)] mt-1">Blue: y ≥ x + 1 · Orange: y &lt; x + ${k}</div>`,
            };
          },
        },
        {
          title: 'Lab 4: Budget Tightening & Viable Bundles',
          prompt: 'Gadget packs: x + y ≤ 5 (max 5 items) & 3x + y ≤ B (budget $B). Slide B from $13 down to $11 — what happens to bundles (3, 2) and (3, 3)?',
          slider: { label: 'Budget B ($)', min: 7, max: 13, step: 1, init: 13, target: 11 },
          choices: [
            { text: 'At B = $11, (3, 3) is knocked OUT ($12 > $11), while (3, 2) sits right on the solid boundary ($11 ≤ $11, STILL VALID!).', ok: true },
            { text: 'Both (3, 2) and (3, 3) are knocked out because they sit on a boundary.', ok: false },
            { text: 'Neither changes because x + y ≤ 5 is the tighter rule.', ok: false },
          ],
          explain: 'Second-order constraint reasoning (A-CED.A.3): Tightening B pulls the orange budget line inward. At B = 11, 3(3) + 2 = 11 (≤ 11 TRUE), while 3(3) + 3 = 12 (FALSE)!',
          renderViz: (B) => {
            const lines = [
              { a: 1, b: 1, c: 5, color: '#3b82f6' },
              { a: 3, b: 1, c: B, color: '#f97316' },
            ];
            const shades = [
              { a: 1, b: 1, c: 5, op: '<=', color: '#3b82f6' },
              { a: 3, b: 1, c: B, op: '<=', color: '#f97316' },
            ];
            let poly = clipHalfPlane(FULL_BOX, 1, 0, '>=', 0);
            poly = clipHalfPlane(poly, 0, 1, '>=', 0);
            poly = clipHalfPlane(poly, 1, 1, '<=', 5);
            poly = clipHalfPlane(poly, 3, 1, '<=', B);
            const ok32 = 3 + 2 <= 5 && 9 + 2 <= B;
            const ok33 = 3 + 3 <= 5 && 9 + 3 <= B; // note 3+3=6 > 5 too! Wait: let's test (2, 3) vs (3, 2) or max 6 items!
            const dots = [
              { x: 3, y: 2, color: ok32 ? '#22c55e' : '#ef4444', label: `(3,2) $${9 + 2}` },
              { x: 3, y: 3, color: ok33 ? '#22c55e' : '#ef4444', label: `(3,3) $${9 + 3}` },
            ];
            return {
              svg: buildCoordSvg({ lines, shades, overlapPoly: poly, dots, sizeClass: 'w-full max-w-sm mx-auto block' }),
              readout: `<div class="font-mono text-sm font-bold">Budget = $${B}: (3,2) is ${ok32 ? '✅ IN' : '❌ OUT'} · (3,3) is ${ok33 ? '✅ IN' : '❌ OUT'}</div><div class="text-xs text-[var(--muted-foreground)] mt-1">Blue: x + y ≤ 5 · Orange: 3x + y ≤ ${B} (x,y ≥ 0)</div>`,
            };
          },
        },
      ];

      // Note on Lab 4: (3,3) has 3+3=6 > 5! Let's fix Lab 4 constraint to x + y <= 6 so (3,3) IS valid at B=$13 and knocked out ONLY by the budget drop to $11!
      ch2Act3Puzzles[3].prompt = 'Gadget packs: x + y ≤ 6 (max 6 items) & 3x + y ≤ B (budget $B). Slide B from $13 down to $11 — what happens to (3, 2) and (3, 3)?';
      ch2Act3Puzzles[3].renderViz = (B) => {
        const lines = [
          { a: 1, b: 1, c: 6, color: '#3b82f6' },
          { a: 3, b: 1, c: B, color: '#f97316' },
        ];
        const shades = [
          { a: 1, b: 1, c: 6, op: '<=', color: '#3b82f6' },
          { a: 3, b: 1, c: B, op: '<=', color: '#f97316' },
        ];
        let poly = clipHalfPlane(FULL_BOX, 1, 0, '>=', 0);
        poly = clipHalfPlane(poly, 0, 1, '>=', 0);
        poly = clipHalfPlane(poly, 1, 1, '<=', 6);
        poly = clipHalfPlane(poly, 3, 1, '<=', B);
        const ok32 = 3 + 2 <= 6 && 9 + 2 <= B;
        const ok33 = 3 + 3 <= 6 && 9 + 3 <= B;
        const dots = [
          { x: 3, y: 2, color: ok32 ? '#22c55e' : '#ef4444', label: `(3,2) $${9 + 2}` },
          { x: 3, y: 3, color: ok33 ? '#22c55e' : '#ef4444', label: `(3,3) $${9 + 3}` },
        ];
        return {
          svg: buildCoordSvg({ lines, shades, overlapPoly: poly, dots, sizeClass: 'w-full max-w-sm mx-auto block' }),
          readout: `<div class="font-mono text-sm font-bold">Budget = $${B}: (3,2) is ${ok32 ? '✅ IN' : '❌ OUT'} · (3,3) is ${ok33 ? '✅ IN' : '❌ OUT'}</div><div class="text-xs text-[var(--muted-foreground)] mt-1">Blue: x + y ≤ 6 · Orange: 3x + y ≤ ${B} (x,y ≥ 0)</div>`,
        };
      };

      let ch2Act3 = null;
      function initCh2Act3(idx) {
        const p = ch2Act3Puzzles[idx];
        ch2Act3 = { idx, val: p.slider.init, picked: null, solved: false, msg: null };
      }

      function renderCh2Act3() {
        const idx = state.idx2[3];
        if (!ch2Act3 || ch2Act3.idx !== idx) initCh2Act3(idx);
        const p = ch2Act3Puzzles[idx];
        const s = ch2Act3;
        const vz = p.renderViz(s.val);

        stage.innerHTML = `
          <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-[var(--border)]">
            <div class="flex items-center gap-1.5">
              ${ch2Act3Puzzles.map((_, i) => `
                <button data-c2p3="${i}" class="px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer border ${i === idx ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)]' : state.cleared2[3][i] ? 'bg-emerald-500/15 text-emerald-500 border-emerald-500/40' : 'bg-[var(--background)] border-[var(--border)] text-[var(--muted-foreground)]'}">
                  ${state.cleared2[3][i] ? '✓ ' : ''}L${i + 1}
                </button>
              `).join('')}
            </div>
            <span class="text-xs font-semibold text-[var(--success)]">Second-Order Graph Lab</span>
          </div>

          <div class="grid md:grid-cols-12 gap-4 items-start">
            <div class="md:col-span-6 space-y-3">
              <div>
                <h2 class="text-base font-bold m-0">${p.title}</h2>
                <p class="text-sm font-medium mt-1 mb-0">${p.prompt}</p>
              </div>

              <div class="rounded-xl bg-[var(--background)] border border-[var(--border)] p-3 space-y-2">
                <div class="flex items-center justify-between gap-2">
                  <label class="text-xs font-bold flex items-center gap-2">
                    <span>🔬 ${p.slider.label}:</span>
                    <span id="c2a3-val" class="px-2 py-0.5 rounded bg-[var(--card)] border border-[var(--border)] font-mono">${s.val}</span>
                  </label>
                  <button id="c2a3-snap" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-[var(--secondary)] text-[var(--secondary-foreground)] border border-[var(--border)] cursor-pointer">Jump to ${p.slider.target}</button>
                </div>
                <input id="c2a3-slider" type="range" min="${p.slider.min}" max="${p.slider.max}" step="${p.slider.step}" value="${s.val}" class="w-full accent-[var(--primary)] cursor-pointer" />
                <div id="c2a3-readout">${vz.readout}</div>
              </div>

              <div class="space-y-2">
                <div class="text-xs font-bold text-[var(--muted-foreground)] uppercase">Lock in your second-order conclusion:</div>
                ${p.choices.map((ch, ci) => {
                  const chosen = s.picked === ci;
                  const cls = s.solved && ch.ok
                    ? 'border-emerald-500 bg-emerald-500/15 text-emerald-400'
                    : chosen && !ch.ok
                    ? 'border-rose-500 bg-rose-500/15 text-rose-400'
                    : 'border-[var(--border)] bg-[var(--background)] hover:border-[var(--primary)]';
                  return `
                    <button data-c2c3="${ci}" ${s.solved ? 'disabled' : ''} class="w-full text-left px-3.5 py-2.5 rounded-xl border-2 text-xs font-semibold transition cursor-pointer ${cls}">
                      ${ch.text}
                    </button>
                  `;
                }).join('')}
              </div>

              ${s.msg ? `
                <div class="anim-in rounded-xl p-3 border text-xs font-semibold space-y-1.5 ${s.solved ? 'bg-emerald-500/15 border-emerald-500/50 text-emerald-400' : 'bg-amber-500/15 border-amber-500/50 text-amber-400'}">
                  <div>${s.msg}</div>
                  ${s.solved ? `<div class="text-[var(--foreground)] font-normal">${p.explain}</div>` : ''}
                  ${s.solved && idx < ch2Act3Puzzles.length - 1 ? `<button id="c2a3-next" class="mt-1 px-3 py-1.5 rounded-lg bg-emerald-500 text-white font-bold text-xs cursor-pointer">Next Lab →</button>` : ''}
                </div>
              ` : ''}
            </div>

            <div id="c2a3-svg" class="md:col-span-6">${vz.svg}</div>
          </div>
        `;

        stage.querySelectorAll('[data-c2p3]').forEach((b) => {
          b.addEventListener('click', () => {
            state.idx2[3] = Number(b.dataset.c2p3);
            initCh2Act3(state.idx2[3]);
            renderCh2Act3();
          });
        });

        const slider = document.getElementById('c2a3-slider');
        const valEl = document.getElementById('c2a3-val');
        const readEl = document.getElementById('c2a3-readout');
        const svgEl = document.getElementById('c2a3-svg');
        const syncViz = () => {
          const out = p.renderViz(s.val);
          valEl.textContent = s.val;
          readEl.innerHTML = out.readout;
          svgEl.innerHTML = out.svg;
        };
        slider.addEventListener('input', () => { s.val = Number(slider.value); syncViz(); });
        document.getElementById('c2a3-snap').addEventListener('click', () => {
          s.val = p.slider.target;
          slider.value = s.val;
          beep(440, 0.06);
          syncViz();
        });

        stage.querySelectorAll('[data-c2c3]').forEach((b) => {
          b.addEventListener('click', () => {
            const ci = Number(b.dataset.c2c3);
            s.picked = ci;
            if (p.choices[ci].ok) {
              s.solved = true;
              s.msg = '🔮 Second-Order Mastery! (+35 XP)';
              sfxWin();
              addXP(35);
              markCleared2(3, idx);
            } else {
              sfxWarn();
              breakStreak();
              s.msg = 'Drag the slider to ' + p.slider.target + ' and watch the graph respond!';
            }
            renderCh2Act3();
          });
        });

        const nxt = document.getElementById('c2a3-next');
        if (nxt) nxt.addEventListener('click', () => {
          state.idx2[3] = idx + 1;
          initCh2Act3(state.idx2[3]);
          renderCh2Act3();
        });
      }

      function render() {
        updateHud();
        if (state.ch === 1) {
          if (state.act === 1) renderAct1();
          else if (state.act === 2) renderAct2();
          else renderAct3();
        } else {
          if (state.act === 1) renderCh2Act1();
          else if (state.act === 2) renderCh2Act2();
          else renderCh2Act3();
        }
      }

      window.addEventListener('themechange', render);
      render();
    })();
  </script>
</body>
</html>
